name: Installed Chromium extension
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  installed-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install disposable-browser harness
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium with new headless extension support
        run: npx playwright install --with-deps chromium
      - name: Test unpacked extension with real worker
        run: node tests/extension-installed.mjs
